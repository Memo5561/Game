<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Blocko master icon. Full-bleed square; Play Store / launchers apply their own mask. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A9E"/>
      <stop offset="1" stop-color="#1B1446"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#7B5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A86"/><stop offset="1" stop-color="#E02A45"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE57A"/><stop offset="1" stop-color="#F5A800"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FE3FF"/><stop offset="1" stop-color="#0F95E0"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C79BFF"/><stop offset="1" stop-color="#7A2FE6"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0B0826" flood-opacity="0.55"/>
    </filter>
    <g id="block">
      <rect x="0" y="0" width="250" height="250" rx="46"/>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g filter="url(#drop)">
    <!-- 2x2 jewel blocks, centred in the 66% adaptive-icon safe zone -->
    <g transform="translate(250 250)">
      <rect width="250" height="250" rx="46" fill="url(#red)"/>
      <rect x="22" y="18" width="206" height="96" rx="34" fill="url(#shine)"/>
    </g>
    <g transform="translate(524 250)">
      <rect width="250" height="250" rx="46" fill="url(#yellow)"/>
      <rect x="22" y="18" width="206" height="96" rx="34" fill="url(#shine)"/>
    </g>
    <g transform="translate(250 524)">
      <rect width="250" height="250" rx="46" fill="url(#cyan)"/>
      <rect x="22" y="18" width="206" height="96" rx="34" fill="url(#shine)"/>
    </g>
    <g transform="translate(524 524)">
      <rect width="250" height="250" rx="46" fill="url(#purple)"/>
      <rect x="22" y="18" width="206" height="96" rx="34" fill="url(#shine)"/>
    </g>
  </g>

  <!-- sparkle -->
  <path d="M790 196 L806 246 L856 262 L806 278 L790 328 L774 278 L724 262 L774 246 Z" fill="#FFFFFF" opacity="0.92"/>
</svg>
