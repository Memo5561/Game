# Library versions for the Blocko Android shell (verified on developer.android.com, October 2026).
# The Android Gradle plugin version lives in ../build.gradle.kts.
[versions]
androidxActivity = "1.13.0"
androidxCore = "1.19.1"
androidxFragment = "1.9.1"
androidxCoreSplashscreen = "1.2.0"
androidxWebkit = "1.17.1"
androidxWork = "2.12.0"
playServicesAds = "25.5.0"
userMessagingPlatform = "4.0.0"
playBilling = "9.1.0"
playReview = "2.0.2"

[libraries]
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidxFragment" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxCoreSplashscreen" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidxWork" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
play-ump = { module = "com.google.android.ump:user-messaging-platform", version.ref = "userMessagingPlatform" }
play-billing = { module = "com.android.billingclient:billing", version.ref = "playBilling" }
play-review = { module = "com.google.android.play:review", version.ref = "playReview" }
