# Gradle / Android settings
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Blocko release settings (can also be overridden on the command line: -PNAME=value)
# ---------------------------------------------------------------------------

# Increase BLOCKO_VERSION_CODE by 1 for EVERY upload to Google Play.
BLOCKO_VERSION_CODE=1
BLOCKO_VERSION_NAME=1.0.0

# test = Google test ads (debug and staging ALWAYS use test ads, whatever this says)
# live = your real AdMob ids below (release only). The release build fails if an id is missing.
BLOCKO_ADS_MODE=test

# AdMob app id, format ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY (AdMob > Apps > App settings)
BLOCKO_ADMOB_APP_ID=ca-app-pub-1792665244557755~3767150262
# Ad unit ids, format ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ (AdMob > Apps > Ad units)
# Banner = "Banner" (adaptive), interstitial = "Interstitial", rewarded = "Rewarded"
BLOCKO_ADMOB_BANNER_ID=ca-app-pub-1792665244557755/6777376855
BLOCKO_ADMOB_INTERSTITIAL_ID=ca-app-pub-1792665244557755/2234576741
BLOCKO_ADMOB_REWARDED_ID=ca-app-pub-1792665244557755/9809814433

# Optional: hashed test device ids, comma separated (Logcat prints them: "setTestDeviceIds(...)").
# Real ads are never shown to these devices; the consent debug settings also use them.
BLOCKO_TEST_DEVICE_IDS=
