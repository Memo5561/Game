<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/game/assets/fonts/fonts.css">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; font-family: 'Nunito', sans-serif; }
  .wrap {
    position: relative; width: 1024px; height: 500px; overflow: hidden;
    background: radial-gradient(ellipse at 70% 40%, #6A4BFF 0%, rgba(106,75,255,0) 55%),
                linear-gradient(180deg, #3B2A9E 0%, #1B1446 100%);
  }
  .title {
    position: absolute; left: 70px; top: 120px; color: #fff;
    font-weight: 900; font-size: 132px; letter-spacing: -2px; line-height: 1;
    text-shadow: 0 8px 0 #0E0A30, 0 18px 40px rgba(0,0,0,.45);
  }
  .title span { display: inline-block; }
  .tag {
    position: absolute; left: 76px; top: 285px; color: #FFD23F;
    font-weight: 800; font-size: 40px; letter-spacing: 1px;
    text-shadow: 0 4px 0 #0E0A30;
  }
  .sub { position: absolute; left: 78px; top: 345px; color: rgba(255,255,255,.75); font-weight: 700; font-size: 24px; }
  .board {
    position: absolute; right: 70px; top: 50px; width: 400px; height: 400px; border-radius: 28px;
    background: #140F3A; box-shadow: inset 0 0 0 4px rgba(255,255,255,.06), 0 30px 60px rgba(0,0,0,.45);
    transform: rotate(-8deg); display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 14px; box-sizing: border-box;
  }
  .c { border-radius: 8px; background: rgba(255,255,255,.05); }
  .b { border-radius: 8px; position: relative; box-shadow: inset 0 -5px 0 rgba(0,0,0,.22); }
  .b::after { content: ''; position: absolute; left: 12%; right: 12%; top: 8%; height: 34%; border-radius: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0)); }
  .sparkle { position: absolute; width: 60px; height: 60px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title"><span>Blocko</span></div>
  <div class="tag">BLOCK PUZZLE</div>
  <div class="sub">Drag · Drop · Blast!</div>
  <div class="board" id="board"></div>
  <svg class="sparkle" style="left:560px;top:40px" viewBox="0 0 100 100"><path d="M50 0 L62 38 L100 50 L62 62 L50 100 L38 62 L0 50 L38 38 Z" fill="#fff"/></svg>
  <svg class="sparkle" style="left:950px;top:400px;width:38px;height:38px" viewBox="0 0 100 100"><path d="M50 0 L62 38 L100 50 L62 62 L50 100 L38 62 L0 50 L38 38 Z" fill="#FFD23F"/></svg>
</div>
<script>
  // 8x8 showcase board; letters = colors, '.' = empty
  const rows = [
    'RR..YYYY',
    'R...C..P',
    'GG..C.PP',
    'GG.BB..P',
    '..OBB...',
    'OOO..PPP',
    'CCCCCCCC',
    'Y.RR.GG.',
  ];
  const col = {
    R: ['#FF7A86', '#E02A45'], Y: ['#FFE57A', '#F5A800'], C: ['#7FE3FF', '#0F95E0'], P: ['#C79BFF', '#7A2FE6'],
    G: ['#7DF0A8', '#1DB863'], B: ['#8FA2FF', '#3A55F0'], O: ['#FFB877', '#F2710F'],
  };
  const board = document.getElementById('board');
  for (const row of rows) for (const ch of row) {
    const d = document.createElement('div');
    if (ch === '.') d.className = 'c';
    else { d.className = 'b'; d.style.background = `linear-gradient(180deg, ${col[ch][0]}, ${col[ch][1]})`; }
    board.appendChild(d);
  }
  // highlight the full row like a line clear
  [...board.children].slice(48, 56).forEach((d) => { d.style.boxShadow = '0 0 18px 4px rgba(127,227,255,.85), inset 0 -5px 0 rgba(0,0,0,.2)'; });
</script>
</body>
</html>
