<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Blocko – render sandbox</title>
<!--
  Standalone test page for game/js/render/* and game/js/input/drag.js.
  Serve the REPO ROOT (not game/):  node -e "import('./tools/serve.mjs').then(m=>m.startServer(8090,process.cwd()))"
  then open http://127.0.0.1:8090/tools/render-sandbox.html?theme=jewel&scenario=mid
  Query: theme=<id> scenario=<name> hud=0 (hide mock HUD) ui=1 (scenario/theme buttons) seed=<n>
  Keys: 1-6 themes, n new game, r revive, h hammer mode, s shuffle, f freeze, t tutorial.
-->
<link rel="stylesheet" href="/game/assets/fonts/fonts.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg-bottom, #1B1446); color: var(--text, #fff);
    font-family: Nunito, system-ui, sans-serif; font-weight: 800;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  body.landscape #app { flex-direction: row; }
  #hud {
    flex: 0 0 auto; height: 92px; box-sizing: border-box; padding: 10px 18px 0;
    background: var(--bg-top, #3B2A9E); display: flex; align-items: center; justify-content: space-between;
  }
  body.landscape #hud {
    width: clamp(200px, 26vw, 320px); height: auto; flex-direction: column; justify-content: center; gap: 28px;
    background: linear-gradient(var(--bg-top, #3B2A9E), var(--bg-bottom, #1B1446));
  }
  body.nohud #hud { display: none; }
  .stat { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
  .stat .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim, #bbb); font-weight: 800; }
  .stat .v { font-size: 30px; font-weight: 900; line-height: 1.05; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .stat.best .v { font-size: 18px; color: var(--coin, #FFC72C); }
  #goals { font-size: 16px; color: var(--text, #fff); }
  #stage { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #tools { position: fixed; right: 6px; bottom: 6px; display: none; flex-wrap: wrap; gap: 4px; max-width: 70vw; justify-content: flex-end; }
  body.ui #tools { display: flex; }
  #tools button { font: 800 12px Nunito, sans-serif; border: 0; border-radius: 8px; padding: 6px 8px; background: var(--btn, #2FCB72); color: var(--btn-text, #fff); box-shadow: 0 3px 0 var(--btn-shadow, #178A4A); }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat best"><span class="k">Best</span><span class="v" id="best">0</span></div>
    <div class="stat"><span class="k">Score</span><span class="v" id="score">0</span></div>
    <div class="stat"><span class="k" id="goalsK">Combo</span><span class="v" id="goals">–</span></div>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
</div>
<div id="tools"></div>
<script type="module" src="/tools/render-sandbox.js"></script>
</body>
</html>
