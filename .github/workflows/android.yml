name: Android build

on:
  push:
    branches: [ main, 'ccr-**' ]
  pull_request:
  workflow_dispatch:

jobs:
  web-tests:
    name: Game logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the APK as the 'debug-latest' pre-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK. Accept the licenses and let the Android Gradle
      # plugin download exactly the platform/build-tools it needs for compileSdk 37.
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "sdk.dir=$SDK" > android/local.properties
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          echo "Available platform packages (for diagnosis):"
          "$SDKMANAGER" --list 2>/dev/null | grep -E '^ *platforms;android-3[6-9]' | sort -u || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: blocko-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # A stable download link for testers: the newest debug APK as pre-release 'debug-latest'.
      - name: Publish APK as pre-release debug-latest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/*.apk blocko-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest blocko-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Blocko Debug-APK (neuester Build)" \
            --notes "Automatisch gebaut aus $GITHUB_SHA. Nur zum Testen: enthält Google-Testwerbung, Käufe sind nicht aktiv."
