name: Android build

on:
  push:
    branches: [ main, 'ccr-**' ]
  pull_request:
  workflow_dispatch:

jobs:
  web-tests:
    name: Game logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK; use its own sdkmanager (setup-android@v3 tries to
      # install the removed 'tools' package and fails).
      - name: Install SDK packages (compileSdk 37, build tools 36)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER (SDK at $SDK)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: blocko-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
